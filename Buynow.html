<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop-WIT-Us Products</title>
    
    <link
      href=""
      rel="stylesheet"
    />
    <link rel="stylesheet" href="yo.css" />
  </head>
  <body class="product-body">
    <header class="product-header">
      <nav class="topbar">
        <div class="brand-wrap">
          <img src="logowitshs.png" alt="WITSHS logo" class="brand-mark" />
          <span class="brand-name">SHOP-WIT-US</span>
        </div>

       
      </nav>
    </header>

    <main class="products-page">
      <section class="intro" id="features">
       
      </section>

      <section class="product-grid" id="catalog">
        <article class="product-card">
          <div class="product-art art-one">
            <img src="uniform-set.png" alt="WITSHS student uniforms" />
            <span>Uniform Set</span>
          </div>
          <div class="product-info">
            <h3>Uniform Set</h3>
            <p>Includes one uniform shirt and one pair of uniform pants.</p>
            <div class="product-meta">
              <strong>₱1,800</strong>
              <button type="button" onclick="window.location.href='Uniform Cart.html'">Add to Cart</button>
            </div>
          </div>
        </article>

        <article class="product-card">
          <div class="product-art art-two">
            <img src="departmental-shirt.png" alt="Departmental shirt, front and back" />
            <span>Departmental Shirt</span>
          </div>
          <div class="product-info">
            <h3>Departmental Shirt</h3>
            <p>Stylish departmental shirt for students.</p>
            <div class="product-meta">
              <strong>₱450              </strong>
              <button type="button" onclick="window.location.href='Departmental Shirt.html'">Add to Cart</button>
            </div>
          </div>
        </article>

        <article class="product-card">
          <div class="product-art art-three">
            <img src="accessories.png" alt="WITSHS school accessory pin" />
            <span>Accessories</span>
          </div>
          <div class="product-info">
            <h3>Accessories</h3>
            <p>Needed/Stylish accessories for students.</p>
            <div class="product-meta">
              <strong>₱40</strong>
              <button type="button" onclick="window.location.href='Accessories.html'">Add to Cart</button>
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
